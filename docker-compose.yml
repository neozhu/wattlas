services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wattlas:local
    ports:
      - "48734:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/").then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
